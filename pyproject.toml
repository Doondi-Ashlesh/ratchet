[project]
name = "ratchet"
version = "0.1.0"
description="A harness for long-running LLM agents, built around a progress metric that can only move one way."
requires-python=">=3.11"
dependencies=[]

[project.optional-dependencies]
agent = [
  # The agent loop, its tools and its bounds are all upstream. `openai` is gone:
  # nothing here speaks to a provider directly any more.
  "langchain>=1.0",
  "langchain-nvidia-ai-endpoints>=1.4",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langsmith>=0.1",
  "truststore>=0.9",
]
# Referenced, not restated. These were two lists that had to stay identical, and
# they did not: the agent extra moved from `openai` to `langchain` and `dev` kept
# the old line, so CI type-checked without the libraries the source imports and
# failed on a green local run.
dev = [
  "ratchet[agent]",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3",
]

[project.scripts]
ratchet = "ratchet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.ruff]
line-length=100

[tool.mypy]
strict = true
files = ["src/ratchet"]
