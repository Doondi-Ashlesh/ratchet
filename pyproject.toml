[project]
name = "ratchet"
version = "0.1.0"
description="A harness for long-running LLM agents, built around a progress metric that can only move one way."
requires-python=">=3.11"
dependencies=[]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.ruff]
line-length=100

[tool.mypy]
strict = true
files = ["src/ratchet"]